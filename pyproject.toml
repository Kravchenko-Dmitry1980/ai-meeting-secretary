[project]
name = "secretary"
version = "0.1.0"
description = "Local Windows meeting recorder and evidence-grounded meeting processing"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "python-docx>=1.1,<2", "psutil>=6,<8", "PyAudioWPatch>=0.2.12.7,<0.3; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/secretary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.runtime/pytest-temp"
asyncio_mode = "auto"
pythonpath = ["backend"]

